<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>The Averian</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="https://i.ibb.co/MyMQMS1J/icon-192.png" />
    <link rel="apple-touch-icon" href="https://i.ibb.co/MyMQMS1J/icon-192.png" />
    <meta name="theme-color" content="#eab308" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Early capture of beforeinstallprompt for PWA installation
      window.__pwa_deferred_prompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwa_deferred_prompt = e;
        window.dispatchEvent(new CustomEvent('pwa_prompt_ready', { detail: e }));
      });
    </script>
    <script src="https://js.yoco.com/sdk/v1/yoco-sdk-web.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(registration => {
            // Check for updates immediately on load
            registration.update();

            // If an update is waiting, prompt skipWaiting immediately
            if (registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            }

            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });

            // Check for updates periodically every 15 minutes
            setInterval(() => {
              registration.update();
            }, 15 * 60 * 1000);
          });
        });

        // Reload the page when a new service worker takes over
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        // Check for updates when the user returns to the app
        window.addEventListener('focus', () => {
          navigator.serviceWorker.ready.then(registration => {
            registration.update();
          });
        });
      }
    </script>
  </body>
</html>
